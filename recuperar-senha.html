<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar senha – Canal Seguro</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="assets/images/logo-canal-seguro-mark.png" type="image/png" />
</head>
<body>
  <div class="demo-banner" id="modeBanner">
    <strong>Recuperação de senha</strong> — disponível com API servidor (Etapa 04).
  </div>
  <div class="login-page">
    <div class="login-card">
      <div class="login-card__brand">
        <img class="logo-platform logo-platform--auth" src="assets/images/logo-canal-seguro.png" alt="Canal Seguro — Canal de Denúncias" />
        <h1>Esqueci minha senha</h1>
        <p>Informe seu usuário ou e-mail de recuperação</p>
      </div>
      <form id="forgotForm" class="hidden">
        <div class="form-group">
          <label for="email">Usuário ou E-mail</label>
          <input class="form-control" type="text" id="email" name="email" required autocomplete="username" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enviar instruções</button>
      </form>
      <div id="successPanel" class="hidden callout mt-2">
        <p id="successMessage"></p>
      </div>
      <div id="offlinePanel" class="hidden callout mt-2">
        <p class="text-muted">A recuperação segura de senha exige o servidor da API. Execute <code>cd server && npm start</code> e acesse via <code>http://localhost:3000</code>.</p>
      </div>
      <p class="text-center mt-2">
        <a href="login.html">← Voltar ao login</a>
      </p>
    </div>
  </div>

  <script src="js/runtime.js"></script>
  <script src="js/http-api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/app.js"></script>
  <script>
    CSApp.onReady(async () => {
      CSApp.initTheme();
      await CSRuntime.probe();

      if (!CSRuntime.useServer()) {
        document.getElementById('offlinePanel').classList.remove('hidden');
        return;
      }

      document.getElementById('forgotForm').classList.remove('hidden');
      document.getElementById('modeBanner').innerHTML =
        '<strong>Modo servidor</strong> — resposta genérica; e-mail simulado no console do servidor (DEV).';

      document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
          CSApp.toast('Informe seu usuário ou e-mail.', 'warning');
          return;
        }
        try {
          const data = await CSHttpApi.forgotPassword(email);
          document.getElementById('forgotForm').classList.add('hidden');
          document.getElementById('successPanel').classList.remove('hidden');
          document.getElementById('successMessage').textContent = data.message;
        } catch (err) {
          if (err.status === 429) {
            CSApp.toast('Muitas tentativas. Aguarde e tente novamente.', 'warning');
          } else {
            CSApp.toast(CSErrors.userMessage(err, 'Não foi possível processar a solicitação.'), 'error');
          }
        }
      });
    });
  </script>
</body>
</html>
